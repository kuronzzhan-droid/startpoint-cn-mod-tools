notes:
- 迁自 recipes.balance1017 的八角色公式；运行时只读取本 YAML，不导入历史角色脚本。
- 行号从 0 开始，leader 使用 ability 的列号自动映射；插入/删除行逐格断言 null/旧值。
- 目标 1.4.223 ZIP 仅用于独立验收，未参与输入或生成。
- 赛瑞斯 能力1：「非FEVER模式中发动技能时，FEVER槽+35%」改为需水属性共鸣（水属性编成≥6）才生效，数值不变
- 杰拉尔 能力6：删除「水属性共鸣时，直接攻击1次时连击+5」（原来副位时会被主位角色的直击触发）
- 杰拉尔 队长技：新增「水属性共鸣时，自身每直接攻击1次，连击+5（CT 0.5秒）」
- 稻穗 能力2：强化弹射Lv3以上时对最近敌人造成20倍雷属性能力伤害 —— 改为需雷属性共鸣，CT 0.75秒→1秒
- 稻穗 能力3（主位）：强化弹射伤害+300%、自身能力伤害+300%、攻击力+300% —— 改为需雷属性共鸣，数值不变
- 稻穗 能力5：雷属性共鸣时，雷属性角色对麻痹中的敌人伤害 +10%→+5%（独立乘区）；独立乘区能力伤害 +20% 改为独立乘区强化弹射伤害 +10%
- 稻穗 能力6：雷属性共鸣时，FEVER模式中独立乘区强化弹射伤害 +30%→+10%
- 米娅 能力2：强化弹射时自身攻击力+10%（最大+200%）、强化弹射伤害+7.5%（最大+150%）—— 改为需火属性共鸣，数值不变
- 米娅 能力6：自身为队长时独立乘区强化弹射伤害 +20%→+10%；新增「火属性共鸣时，独立乘区强化弹射伤害+10%」（两条可叠加，队长且共鸣时合计仍是+20%）
- 深渊之兽 队长技：深渊相位每升1级 暗属性角色伤害（独立乘区）+25%（最大+100%）→ +10%（最大+40%）；相位3个以上发动强化弹射Lv3时 赋予5秒「自身强化弹射伤害+50%」→「全队能力伤害+50%」
- 深渊之兽 能力2：深渊相位每升1级（最多4级）—— 自身攻击力 +60%→+25%、自身能力伤害 +120%→+25%、暗属性角色攻击力 +25%→+30%、暗属性角色能力伤害 +25%→+60%；伤害（独立乘区）自身 +20% → 暗属性角色 +5%
- 深渊之兽 能力3（主位）：除自身外的角色直接攻击时 赋予20秒「自身强化弹射伤害+50%」→「全队能力伤害+50%」（CT 1秒不变）
- 妮可拉 能力2：火属性共鸣时，自身发动技能时火属性角色技能伤害 +50%（最多5次，最大+250%）→ +20%（最大+100%）
- 妮可拉 能力3：消耗「月讲」时该角色攻击力 +65%→+20%；火属性共鸣时对抗性降低中的敌人 攻击力 +300%→+100%、技能伤害 +300%→+100%，技能伤害额外乘区 +15%→+2%
- 莉莉丝 队长技：雷属性角色能力伤害 +450%→+400%、攻击力 +250%→+150%，并改为需雷属性共鸣
- 莉莉丝 能力1：战斗开始时自身技能槽+50%、雷属性角色能力伤害+200%→+150% —— 两条都改为需雷属性共鸣
- 莉莉丝 能力2：生命值50%以下时 自身能力伤害 +200%→+150%、攻击力 +200%→+100%、强化弹射伤害 +200%→+100%，并改为需雷属性共鸣
- 玛格诺斯 队长技：火属性共鸣时每发动3次强化弹射 引擎点火 +7层→+4层；引擎点火每层火属性角色技能伤害额外乘区 +5%→+3.5%（最多计3层）
- 玛格诺斯 能力3：发动技能时引擎点火+1层 加 CT 4秒；技能命中时消耗引擎点火 1层→2层；引擎点火 5层以上 技能伤害额外乘区 +10% → 6层以上 +5%；每层火属性角色技能伤害额外乘区 +0.5%（最多10层）→ +0.33%（最多15层）；每发动3次强化弹射引擎点火+3层 → 每发动4次强化弹射+1层
- 玛格诺斯 能力5：独立乘区技能伤害 +15%→+10% 并改为需火属性共鸣；每发动3次强化弹射技能槽+5%（CT 5秒）→ 每4次 +4%（CT 6秒）
