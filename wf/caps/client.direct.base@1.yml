form:
  label: 直击基础倍率及目标状态层数
  fields:
  - name: effect_24
    label: 直击基础倍率
    arg_schema:
      '0': 固定万分比
      '1': 每连击万分比
      '2': 目标官方弱体数>=1时固定万分比
      '3': 每个官方弱体的万分比
    value:
      min: -2147483648
      max: 2147483647
      integer: true
      unit: 1/10000
    flags:
      type: integer
      min: 0
      max: 2147483647
      meaning: 仅arg3：逐状态弱体个数封顶，0不限；其余arg忽略
      pin: false
  - name: effect_28
    label: 目标固有状态层数达标的直击基础加成
    arg_schema:
      min: 0
      max: 2147483647
      integer: true
    value:
      min: -2147483648
      max: 2147483647
      integer: true
      unit: 1/10000
    flags:
      type: integer
      min: -2147483648
      max: 2147483647
      meaning: 目标层数阈值N；N<=0按1
      pin: false
  - name: effect_29
    label: 按目标固有状态层数的直击基础加成
    arg_schema:
      min: 0
      max: 2147483647
      integer: true
    value:
      min: -2147483648
      max: 2147483647
      integer: true
      unit: 1/10000
    flags:
      type: integer
      min: -2147483648
      max: 2147483647
      meaning: 单条状态的目标层数封顶cap；cap<=0不封顶
      pin: false
  note: 需要 test-v35e；实际参数规则以累计登记和对应实现说明为准
describe:
  template: 码24基础/连击/弱体数，码28目标指定固有状态达标、码29目标指定固有状态层数；两次非负钳位，旧凯尔倍率继续相乘
